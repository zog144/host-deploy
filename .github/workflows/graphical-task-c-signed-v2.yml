name: Task C signed-v2 owner consumer exact root source
on:
  push:
    branches: [review/task-c-original-identifiers-call-denial-20261104]
  pull_request:
    paths:
      - src/zog/host_deploy/gateway/graphics_owner_ipc.py
      - src/zog/host_deploy/gateway/graphics_owner_observation_v2.py
      - src/zog/host_deploy/gateway/graphics_owner_trust_history.py
      - src/zog/host_deploy/gateway/graphics_owner_trust_service.py
      - src/zog/host_deploy/gateway/graphics_owner_trust_daemon.py
      - tests/test_graphics_owner_trust_daemon.py
      - deploy/graphical-trust-broker/**
      - tests/test_graphics_owner_trust_history.py
      - tests/test_graphics_owner_signed_v2.py
      - .github/workflows/graphical-task-c-signed-v2.yml
permissions:
  contents: read
jobs:
  signed-v2-source:
    runs-on: ubuntu-latest
    timeout-minutes: 16
    strategy:
      fail-fast: false
      matrix:
        python: ['3.12','3.13']
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/checkout@v4
        with:
          repository: zog144/root-control
          ref: 5ad7d5ed72d1b72edc767a658de28506791a74d4
          path: companion-root-control
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - name: Exact root-control v2 pinned head
        run: |
          test "$(git -C companion-root-control rev-parse HEAD)" = 5ad7d5ed72d1b72edc767a658de28506791a74d4
      - run: python -m pip install 'pytest>=8,<10' 'cryptography>=44,<49' 'boto3>=1.34,<2'
      - name: Verify original request, signed-v2, pending observation and replay source
        env:
          PYTHONPATH: ${{ github.workspace }}/src
        run: |
          python -m pytest -q -rs \
            tests/test_graphics_owner_signed_v2.py \
            tests/test_graphics_owner_trust_history.py \
            tests/test_graphics_owner_trust_daemon.py \
            tests/test_graphics_native_ipc_selection.py \
            tests/test_graphical_selected_owner_all_ssm_paths.py \
            tests/test_gateway_generic_pipeline.py
      - name: Native not activated
        if: always()
        run: |
          echo 'Signed-v2 source-only: no installed signer/current S3 history reader/owner SSM activation or gateway IAM proof.' >> "$GITHUB_STEP_SUMMARY"
