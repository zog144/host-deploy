name: First protected graphical task catalogue - source only
on:
  push:
    branches: [regular/first-graphics-catalogue-20261031]
  pull_request:
    branches: [regular/toolchain-gateway-20261019, unstable, main]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  exact-source-pin:
    runs-on: ubuntu-latest
    timeout-minutes: 16
    strategy:
      fail-fast: false
      matrix:
        python: ['3.12','3.13']
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09
        with:
          persist-credentials: false
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09
        with:
          repository: zog144/image-build
          ref: 1f07e83dbd80dacb9bed0d6494c697375f0e26cd
          path: dependencies/image-build
          persist-credentials: false
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1
        with:
          python-version: ${{ matrix.python }}
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09
        with:
          repository: zog144/image-build
          ref: 1616f192ef9d8964a8f37f32a86c69c0242a213c
          path: dependencies/image-build-base-observer
          persist-credentials: false
      - name: Pin observed-isolation compiler reader separately from original recipe source
        run: |
          test "$(git -C dependencies/image-build-base-observer rev-parse HEAD)" = 1616f192ef9d8964a8f37f32a86c69c0242a213c
          python - <<'PY'
          from pathlib import Path
          source=Path('dependencies/image-build-base-observer/src/zog/image_build/compiler_base_acceptance.py').read_text()
          consumer=Path('src/zog/host_deploy/gateway/graphics_base_acceptance.py').read_text()
          assert 'image-build-compiler-base-acceptance-v1' in source
          assert 'image-build-compiler-base-acceptance-v1' in consumer
          assert 'independent-compiler-capability-observed-not-job-authorization' in source
          assert 'independent-compiler-capability-observed-not-job-authorization' in consumer
          isolation=Path('dependencies/image-build-base-observer/src/zog/image_build/compiler_base_isolation.py').read_text()
          assert "image-build-compiler-isolation-v2" in isolation
          assert "selected-root-kernel-mounts-v1" in isolation
          assert "image-build-compiler-isolation-v2" in consumer
          assert "selected-root-kernel-mounts-v1" in consumer
          assert "bf0b37fea1767bf7ab02ca2d1c5d1a0d5487d4b6" not in Path(
             'src/zog/host_deploy/gateway/graphics_catalogue_owner.py').read_text()
          PY
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09
        with:
          repository: zog144/image-build
          ref: 324b1469cb490a571d428cadd9ce72bbec5507b4
          path: dependencies/image-build-prepared
          persist-credentials: false
      - name: Verify original reviewed PR17 preparation is held, not native-authority evidence
        run: test "$(git -C dependencies/image-build-prepared rev-parse HEAD)" = 324b1469cb490a571d428cadd9ce72bbec5507b4
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09
        with:
          repository: zog144/host-deploy
          ref: 02db124609b92396ff89fa628d8ddc9383e05f4b
          path: dependencies/host-deploy-taskc
          persist-credentials: false
      - name: Pin reviewed protected-owner dispatch source independently
        run: test "$(git -C dependencies/host-deploy-taskc rev-parse HEAD)" = 02db124609b92396ff89fa628d8ddc9383e05f4b
      - name: Pin exact source tree and original October pin bytes
        run: |
          python - <<'PY'
          import hashlib
          from pathlib import Path
          from subprocess import check_output
          root=Path('dependencies/image-build')
          assert check_output(['git','-C',str(root),'rev-parse','HEAD'],text=True).strip() == '1f07e83dbd80dacb9bed0d6494c697375f0e26cd'
          p=root/'project/pins/2026-10-01/commit-pin.py'
          assert p.is_file() and not p.is_symlink()
          assert hashlib.sha256(p.read_bytes()).hexdigest() == 'd3104eeddbbbe63fe3279c58ce9807f3b5250632ecdca4826abc028bcf923b36'
          PY
      - name: Install source-only test dependencies
        run: |
          python -m pip install 'pytest>=8,<10' 'boto3>=1.34,<2' 'dbus-next==0.2.3' 'cryptography>=44,<49'
      - name: Validate only exact fonts, bounded resource scope and missing-acceptance refusals
        env:
          AWS_EC2_METADATA_DISABLED: "true"
        run: |
          PYTHONPATH=src python -m pytest -q tests/test_gateway_first_graphics_catalogue.py tests/test_gateway_task_catalogue.py tests/test_gateway_graphical_retained_base_selection.py tests/test_gateway_fonts_pre_admission_review.py
          python -m compileall -q src/zog/host_deploy/gateway/graphics_catalogue_owner.py src/zog/host_deploy/gateway/graphics_base_acceptance.py src/zog/host_deploy/gateway/task_catalogue.py src/zog/host_deploy/gateway/image_build_dispatch.py

      - name: Verify real root-owned one-shot catalogue file, mode and receipt on ephemeral CI
        env:
          AWS_EC2_METADATA_DISABLED: "true"
        run: |
          sudo -E env PYTHONPATH="$PWD/src" "$(command -v python)" -m pytest -q tests/test_gateway_first_graphics_native_install.py -rs
