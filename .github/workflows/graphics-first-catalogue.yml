name: First protected graphical task catalogue - source only
on:
  push:
    branches: [regular/first-graphics-catalogue-20261031]
  pull_request:
    branches: [regular/toolchain-gateway-20261019, unstable, main]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  exact-source-pin:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09
        with:
          persist-credentials: false
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09
        with:
          repository: zog144/image-build
          ref: b0f53dbdec0e88b9b37feb5317398db3d20507dd
          path: dependencies/image-build
          persist-credentials: false
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1
        with:
          python-version: "3.12"
      - name: Pin exact source tree and original October pin bytes
        run: |
          python - <<'PY'
          import hashlib
          from pathlib import Path
          from subprocess import check_output
          root=Path('dependencies/image-build')
          assert check_output(['git','-C',str(root),'rev-parse','HEAD'],text=True).strip() == 'b0f53dbdec0e88b9b37feb5317398db3d20507dd'
          p=root/'project/pins/2026-10-01/commit-pin.py'
          assert p.is_file() and not p.is_symlink()
          assert hashlib.sha256(p.read_bytes()).hexdigest() == 'd3104eeddbbbe63fe3279c58ce9807f3b5250632ecdca4826abc028bcf923b36'
          PY
      - name: Install source-only test dependencies
        run: |
          python -m pip install 'pytest>=8,<10' 'boto3>=1.34,<2' 'dbus-next==0.2.3'
      - name: Validate only exact fonts, bounded resource scope and missing-acceptance refusals
        env:
          AWS_EC2_METADATA_DISABLED: "true"
        run: |
          PYTHONPATH=src python -m pytest -q tests/test_gateway_first_graphics_catalogue.py tests/test_gateway_task_catalogue.py
          python -m compileall -q src/zog/host_deploy/gateway/graphics_catalogue_owner.py
