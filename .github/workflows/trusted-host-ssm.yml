name: Trusted Host SSM local journal source acceptance
on:
  push:
    branches: [regular/task-c-v3-checkpoint-consumer-20261107]
  pull_request:
    paths:
      - src/zog/host_deploy/gateway/trusted_host_submission.py
      - src/zog/host_deploy/gateway/generic_pipeline.py
      - src/zog/host_deploy/gateway/graphics_operation_send_intent.py
      - src/zog/host_deploy/runner.py
      - tests/test_gateway_trusted_host_ssm.py
      - tests/test_gateway_generic_pipeline.py
      - tests/test_gateway_first_fonts_build_record_runtime.py
      - tests/test_gateway_first_fonts_issue_event.py
      - tests/test_gateway_github.py
      - tests/test_gateway_configuration.py
      - src/zog/host_deploy/gateway/github_dispatch.py
      - src/zog/host_deploy/gateway/github_configuration.py
      - .github/workflows/gateway-issue-dispatch.yml
      - .github/ISSUE_TEMPLATE/first-fonts-gateway.md
      - src/zog/host_deploy/image_build_lanes.py
      - src/zog/host_deploy/fonts_lane_profile.py
      - src/zog/host_deploy/cli.py
      - tests/test_fonts_lane_profile.py
      - tests/test_fonts_catalogue_recovery.py
      - src/zog/host_deploy/fonts_lane_runtime.py
      - tests/test_image_build_lanes.py
      - src/zog/host_deploy/gateway/image_build_execution.py
      - src/zog/host_deploy/gateway/graphics_catalogue_owner.py
      - src/zog/host_deploy/gateway/graphics_base_acceptance.py
      - src/zog/host_deploy/gateway/task_catalogue.py
      - src/zog/host_deploy/gateway/github_configuration.py
      - src/zog/host_deploy/gateway/github_dispatch.py
      - src/zog/host_deploy/gateway/consumer.py
      - .github/workflows/gateway-issue-dispatch.yml
      - tests/test_gateway_issue_fifo_first_fonts.py
      - tests/test_gateway_fonts_installed_lane_tuple.py
      - src/zog/host_deploy/gateway/fonts_lane_review.py
      - tests/test_gateway_graphical_submission_journal_review.py
      - tests/test_gateway_trusted_host_cross_owner.py
      - .github/workflows/trusted-host-ssm.yml
permissions:
  contents: read
jobs:
  trusted-host-source:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        python: ['3.12','3.13']
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/checkout@v4
        with:
          repository: zog144/root-control
          ref: db84200822506f41a8df068b997e64ee74ae3ece
          path: companions/root-control
          persist-credentials: false
      - uses: actions/checkout@v4
        with:
          repository: zog144/host-install
          ref: 994f4985be71c08aa1d2d8114c55c6c4d0617665
          path: companions/host-install
          persist-credentials: false
      - uses: actions/checkout@v4
        with:
          repository: zog144/image-build
          ref: 40b6e88a005298924a9369f3c1131efcae36c67d
          path: companions/image-build-compiler-runtime
          persist-credentials: false
      - uses: actions/checkout@v4
        with:
          repository: zog144/build-record
          ref: a866c9c4b0dd385045f00ce2de7d809f5b67c104
          path: companions/build-record
          persist-credentials: false
      - uses: actions/checkout@v4
        with:
          repository: zog144/host-deploy
          ref: 4956d926b56def821e6a57025b803ef21f2ca330
          path: companions/host-deploy-fonts-pr7
          persist-credentials: false
      - uses: actions/checkout@v4
        with:
          repository: zog144/image-build
          ref: 1f07e83dbd80dacb9bed0d6494c697375f0e26cd
          path: dependencies/image-build
          persist-credentials: false
      - uses: actions/checkout@v4
        with:
          repository: zog144/box-control
          ref: fdafbfb3032847b73c77abd9d90d769e43fddf85
          path: companions/box-control-inherited
          persist-credentials: false
      - uses: actions/checkout@v4
        with:
          repository: zog144/image-build
          ref: aa65dfe264eea92ce210895f462d4a8c63e23ff2
          path: companions/image-build-inherited
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - name: Prove actual first-Fonts runtime and build-record dependency compatibility
        run: |
          test "$(git -C companions/image-build-compiler-runtime rev-parse HEAD)" = 40b6e88a005298924a9369f3c1131efcae36c67d
          test "$(git -C companions/build-record rev-parse HEAD)" = a866c9c4b0dd385045f00ce2de7d809f5b67c104
          PYTHONPATH=companions/image-build-compiler-runtime/src:companions/build-record/src python -B - <<'PY'
          from zog.image_build.runtime_requirements import requirements_for, BUILD_RECORD
          import zog.build_record as actual
          contract = requirements_for("pipeline.inspect", external_observed_state=True)
          assert [c["component"] for c in contract["components"]] == ["build-record"]
          assert contract["bindings"]["provenance"] is False
          assert BUILD_RECORD["validated_revision"] == "a866c9c4b0dd385045f00ce2de7d809f5b67c104"
          assert BUILD_RECORD["version"] == actual.__version__ == "0.8.2"
          assert callable(actual.make_record) and callable(actual.Store)
          PY
      - run: python -m pip install 'pytest>=8,<10' 'boto3>=1.34,<2' 'cryptography>=44,<49'
      - name: Verify reviewed first-Fonts gateway and original producer source pins
        run: |
          test "$(git -C companions/host-deploy-fonts-pr7 rev-parse HEAD)" = 4956d926b56def821e6a57025b803ef21f2ca330
          test "$(git -C dependencies/image-build rev-parse HEAD)" = 1f07e83dbd80dacb9bed0d6494c697375f0e26cd
      - name: Verify selected inherited-process runtime and retained original source tuple
        run: |
          test "$(git -C companions/root-control rev-parse HEAD)" = db84200822506f41a8df068b997e64ee74ae3ece
          test "$(git -C companions/host-install rev-parse HEAD)" = 994f4985be71c08aa1d2d8114c55c6c4d0617665
          test "$(git -C companions/box-control-inherited rev-parse HEAD)" = fdafbfb3032847b73c77abd9d90d769e43fddf85
          test "$(git -C companions/image-build-inherited rev-parse HEAD)" = aa65dfe264eea92ce210895f462d4a8c63e23ff2
          cmp dependencies/image-build/project/bootstrap/graphics-fonts.py companions/image-build-inherited/project/bootstrap/graphics-fonts.py
          test ! -e companions/image-build-inherited/project/pins/2026-10-01/commit-pin.py
          PYTHONPATH=src python -B - <<'PY'
          from pathlib import Path
          from zog.host_deploy import image_build_lanes as lanes
          old_source = Path("dependencies/image-build")
          new_source = Path("companions/image-build-inherited")
          stage_paths = ("libpng", "freetype", "fontconfig")
          for project in stage_paths:
              for old in (old_source / "project/package" / project).rglob("*"):
                  if old.is_file():
                      assert old.read_bytes() == (new_source / old.relative_to(old_source)).read_bytes(), old
          assert lanes.FIRST_FONTS_INHERITED_PRODUCER_REVISION == "aa65dfe264eea92ce210895f462d4a8c63e23ff2"
          assert str(lanes.FIRST_FONTS_MIGRATED_ROOT) == "/var/lib/zog/image-build/projects/gateway-first-fonts-runtime"
          assert "execution_user_id" not in (new_source / "src/zog/image_build/box_control_adapter.py").read_text()
          assert "execution_group_id" not in (new_source / "src/zog/image_build/configuration.py").read_text()
          controller = Path("companions/root-control/src/zog/root_control/build.py").read_text()
          assert "'User':" not in controller and "'Group':" not in controller
          protocol = Path("companions/box-control-inherited/box-control/src/zog/box_control/build_protocol.py").read_text()
          assert '"execution_user_id"' not in protocol and '"execution_group_id"' not in protocol
          installer = Path("companions/host-install/src/zog/host_install/fonts_project_migration.py").read_text()
          assert 'NEW = "/var/lib/zog/image-build/projects/gateway-first-fonts-runtime"' in installer
          PY
      - name: Trusted Host selection + durable send-once + reconciliation
        env:
          PYTHONPATH: ${{ github.workspace }}/src:${{ github.workspace }}/tests:${{ github.workspace }}/companions/root-control/src:${{ github.workspace }}/companions/host-install/src
          ZOG_HOSTDEPLOY_FONTS_PR7: ${{ github.workspace }}/companions/host-deploy-fonts-pr7
        run: |
          test "$(git -C companions/root-control rev-parse HEAD)" = db84200822506f41a8df068b997e64ee74ae3ece
          test "$(git -C companions/host-install rev-parse HEAD)" = 994f4985be71c08aa1d2d8114c55c6c4d0617665
          python -m pytest -q -rs \
            tests/test_gateway_trusted_host_ssm.py \
            tests/test_gateway_generic_pipeline.py \
            tests/test_gateway_graphical_submission_journal_review.py \
            tests/test_gateway_trusted_host_cross_owner.py \
            tests/test_gateway_first_fonts_build_record_runtime.py \
            tests/test_gateway_issue_fifo_first_fonts.py \
            tests/test_gateway_fonts_installed_lane_tuple.py \
            tests/test_image_build_lanes.py \
            tests/test_fonts_lane_profile.py \
            tests/test_fonts_catalogue_recovery.py \
            tests/test_gateway_github.py \
            tests/test_gateway_protocol.py \
            tests/test_gateway_consumer.py \
            tests/test_gateway_generic_consumer.py \
            tests/test_gateway_first_fonts_issue_event.py \
            tests/test_gateway_github.py \
            tests/test_gateway_configuration.py \
            tests/test_runner_ssm.py
      # Source archive for native Work: the exact PR head, not GitHub's synthetic merge ref.
      # This is a CI artifact, never a committed bundle or an installation authorization.
      - name: Checkout exact PR head for source handoff
        if: ${{ always() && github.event_name == 'pull_request' }}
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          path: reviewed-source
          persist-credentials: false
      - name: Package audited source identity for Work
        if: ${{ always() && github.event_name == 'pull_request' }}
        run: |
          test "$(git -C reviewed-source rev-parse HEAD)" = "${{ github.event.pull_request.head.sha }}"
          # The selected source modules exercised above must match the exported head.
          cmp reviewed-source/src/zog/host_deploy/image_build_lanes.py src/zog/host_deploy/image_build_lanes.py
          cmp reviewed-source/tests/test_image_build_lanes.py tests/test_image_build_lanes.py
          mkdir -p source-handoff
          git -C reviewed-source archive --format=tar HEAD > source-handoff/host-deploy-source.tar
          (cd source-handoff && sha256sum host-deploy-source.tar > SHA256SUMS)
          git -C reviewed-source rev-parse HEAD > source-handoff/SOURCE_COMMIT
      - name: Publish exact source archive (seven-day retention)
        if: ${{ always() && github.event_name == 'pull_request' }}
        uses: actions/upload-artifact@v4
        with:
          name: reviewed-host-deploy-source-${{ github.event.pull_request.head.sha }}
          path: source-handoff/
          if-no-files-found: error
          retention-days: 7
      - if: always()
        run: echo 'Source-only trusted Host IAM SSM; no AWS calls or native submissions were performed.' >> "$GITHUB_STEP_SUMMARY"
