name: Held TableGen graphical successor (offline source review)
on:
  push:
    branches: [review/held-graphics-tablegen-successor-20261104]
  pull_request:
    paths:
      - 'project/held-graphical-catalogue/*tablegen-successor*'
      - 'tools/verify_held_graphical_tablegen_successor.py'
      - 'tests/test_held_graphical_tablegen_successor.py'
      - '.github/workflows/held-graphical-tablegen-successor.yml'
permissions:
  contents: read
jobs:
  successor-without-authority:
    runs-on: ubuntu-latest
    timeout-minutes: 18
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09
        with:
          persist-credentials: false
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09
        with:
          repository: zog144/image-build
          ref: a1ad8fd41186d70cc2f7d8f4ebe7b0ae54e4f023
          path: dependencies/image-build-pr9
          persist-credentials: false
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09
        with:
          repository: zog144/image-build
          ref: 9cbd652226b863a7b4bb2d6d9539722e1a262508
          path: dependencies/image-build-pr8-old
          persist-credentials: false
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09
        with:
          repository: zog144/image-build
          ref: ed6ea94586ceeb13feee905b9e70afcb8963b128
          path: dependencies/image-build-pr8-new
          persist-credentials: false
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1
        with:
          python-version: '3.12'
      - name: Install source-test dependencies only
        run: python -m pip install 'pytest==8.4.2' 'boto3>=1.34,<2' 'dbus-next==0.2.3' 'cryptography>=44,<49'
      - name: Verify prior held catalogue and exact corrected LLVM source plan
        env:
          AWS_EC2_METADATA_DISABLED: 'true'
          AWS_DEFAULT_REGION: us-east-1
          PYTHONPATH: src:tools
          ZOG_HELD_PR9_SOURCE: dependencies/image-build-pr9
          ZOG_HELD_MESA_SOURCE: dependencies/image-build-pr8-old
          ZOG_HELD_MESA_OLD_SOURCE: dependencies/image-build-pr8-old
          ZOG_HELD_MESA_NEW_SOURCE: dependencies/image-build-pr8-new
        run: |
          python -m compileall -q tools/verify_held_graphical_tablegen_successor.py tests/test_held_graphical_tablegen_successor.py
          python - <<'PY'
          from tools.verify_held_graphical_tablegen_successor import load, load_review, verify
          import os
          print(verify(load(),load_review(),os.environ["ZOG_HELD_PR9_SOURCE"],os.environ["ZOG_HELD_MESA_OLD_SOURCE"],os.environ["ZOG_HELD_MESA_NEW_SOURCE"]))
          PY
          python -m pytest -q tests/test_held_graphical_tablegen_successor.py tests/test_held_graphical_extension.py tests/test_held_graphical_source_dag_review.py tests/test_gateway_task_catalogue.py tests/test_gateway_protocol.py
      - name: Report no compiler authority
        if: always()
        run: |
          echo 'Source-only successor; older held catalogue and its historic TableGen hole remain intact.' >> "$GITHUB_STEP_SUMMARY"
          echo 'No new task names, privileged claim, accepted generation, original rights, AWS, SSM or compiler submission.' >> "$GITHUB_STEP_SUMMARY"
