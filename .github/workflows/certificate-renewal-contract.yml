name: Certificate renewal controller contract

on:
  push:
    branches: [unstable]
    paths:
      - 'src/zog/host_deploy/certificate_renewal.py'
      - 'src/zog/host_deploy/certificate_renewal_timer.py'
      - 'src/zog/host_deploy/certificate_renewal_publication.py'
      - 'src/zog/host_deploy/certificate_issuer_observer.py'
      - 'src/zog/host_deploy/certificate_issuer_lifecycle.py'
      - 'src/zog/host_deploy/certificate_authenticated_inspection.py'
      - 'src/zog/host_deploy/certificate_issuer_inspection.py'
      - 'src/zog/host_deploy/certificate_selected_inspection.py'
      - 'tests/test_certificate_renewal.py'
      - 'tests/test_certificate_renewal_timer.py'
      - 'tests/test_certificate_renewal_publication.py'
      - 'tests/test_certificate_issuer_observer.py'
      - 'tests/test_certificate_issuer_lifecycle.py'
      - 'tests/test_certificate_box_control_source_pin.py'
      - 'tests/test_certificate_authenticated_inspection.py'
      - 'tests/test_certificate_issuer_inspection.py'
      - 'tests/test_certificate_selected_inspection.py'
      - 'docs/host-deploy/guide/certificate-renewal.md'
      - 'src/zog/host_deploy/certificate-renewal@.service'
      - 'src/zog/host_deploy/certificate-renewal@.timer'
      - '.github/workflows/certificate-renewal-contract.yml'
  pull_request:
    paths:
      - 'src/zog/host_deploy/certificate_renewal.py'
      - 'src/zog/host_deploy/certificate_renewal_timer.py'
      - 'src/zog/host_deploy/certificate_renewal_publication.py'
      - 'src/zog/host_deploy/certificate_issuer_observer.py'
      - 'src/zog/host_deploy/certificate_issuer_lifecycle.py'
      - 'src/zog/host_deploy/certificate_authenticated_inspection.py'
      - 'src/zog/host_deploy/certificate_issuer_inspection.py'
      - 'src/zog/host_deploy/certificate_selected_inspection.py'
      - 'tests/test_certificate_renewal.py'
      - 'tests/test_certificate_renewal_timer.py'
      - 'tests/test_certificate_renewal_publication.py'
      - 'tests/test_certificate_issuer_observer.py'
      - 'tests/test_certificate_issuer_lifecycle.py'
      - 'tests/test_certificate_box_control_source_pin.py'
      - 'tests/test_certificate_authenticated_inspection.py'
      - 'tests/test_certificate_issuer_inspection.py'
      - 'tests/test_certificate_selected_inspection.py'
      - '.github/workflows/certificate-renewal-contract.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  renewal:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.11", "3.12"]
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5 Node 24
        with:
          persist-credentials: false
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6 Node 24
        with:
          python-version: ${{ matrix.python-version }}
      - name: Checkout exact reviewed box-control issuer client
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5 Node 24
        with:
          repository: zog144/box-control
          ref: a3e939b7a22ef6277ae9712961ffbd5a18ccac39
          path: pinned-box-control
          persist-credentials: false
      - name: Install offline test dependency
        run: python -m pip install 'pytest>=8,<10'
      - name: Compile standalone renewal coordinator
        run: python -m compileall -q src/zog/host_deploy/certificate_renewal.py src/zog/host_deploy/certificate_renewal_timer.py src/zog/host_deploy/certificate_renewal_publication.py src/zog/host_deploy/certificate_issuer_observer.py src/zog/host_deploy/certificate_issuer_lifecycle.py src/zog/host_deploy/certificate_issuer_inspection.py src/zog/host_deploy/certificate_selected_inspection.py tests/test_certificate_renewal.py tests/test_certificate_renewal_timer.py tests/test_certificate_renewal_publication.py tests/test_certificate_issuer_observer.py tests/test_certificate_issuer_lifecycle.py tests/test_certificate_issuer_inspection.py tests/test_certificate_selected_inspection.py
      - name: Verify deterministic controller request replay
        env:
          PYTHONPATH: src
        run: python -m pytest -q tests/test_certificate_renewal.py tests/test_certificate_renewal_timer.py tests/test_certificate_renewal_publication.py tests/test_certificate_issuer_observer.py tests/test_certificate_issuer_lifecycle.py tests/test_certificate_issuer_inspection.py tests/test_certificate_selected_inspection.py
      - name: Verify pinned producer inspect client and authenticated reader
        env:
          PYTHONPATH: src:pinned-box-control/box-control/src
          ZOG_BOX_CONTROL_CHECKOUT: pinned-box-control
        run: python -m pytest -q tests/test_certificate_box_control_source_pin.py tests/test_certificate_authenticated_inspection.py
