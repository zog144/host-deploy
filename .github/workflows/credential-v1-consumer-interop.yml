name: Canonical HTTPS credential Cloudflare consumer v1 interoperability
on:
  push:
    branches: [review/cross-host-issuer-owner-admission-20261028]
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  canonical-v1:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.12", "3.13"]
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09
        with:
          persist-credentials: false
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09
        with:
          repository: zog144/host-identify
          ref: 4a176373ff4cb47a66a8ab1b5fd3d6ff01ff2a3b
          path: dependencies/host-identify
          persist-credentials: false
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09
        with:
          repository: zog144/station-access
          ref: 51295bd7a458a621ccbf33eab03da43ba84ce71a
          path: dependencies/station-access
          persist-credentials: false
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install exact source and test only; no native receiver
        run: |
          test "$(git -C dependencies/host-identify rev-parse HEAD)" = "4a176373ff4cb47a66a8ab1b5fd3d6ff01ff2a3b"
          test "$(git -C dependencies/station-access rev-parse HEAD)" = "51295bd7a458a621ccbf33eab03da43ba84ce71a"
          python -m pip install ./dependencies/host-identify 'pytest>=8,<10' 'boto3>=1.34,<2'
          python -m pip install --no-deps -e .
      - name: Canonical protocol, exact public producer vectors and owner policy
        run: |
          python -m compileall -q src/zog/host_deploy/certificate_cloudflare_canonical.py
          python -m pytest -q tests/test_certificate_cloudflare_canonical.py tests/test_certificate_cross_host_admission.py
          python -m pytest -q dependencies/host-identify/tests/test_credential_delivery.py
          PYTHONPATH=dependencies/station-access/src python -m pytest -q dependencies/station-access/verification/credential_v1/test_shared_interop.py
      - name: Reject custom host-deploy draft wire schemas
        run: |
          python - <<'PY'
          from zog.host_identify import credential_delivery as cd
          from zog.host_deploy import certificate_cloudflare_canonical as consumer
          assert cd.REQUEST_SCHEMA == "zog-credential-request-v1"
          assert consumer.PROTOCOL_SOURCE == "4a176373ff4cb47a66a8ab1b5fd3d6ff01ff2a3b"
          assert consumer.PATH == "/.well-known/zog/credential-delivery/v1"
          assert consumer.PURPOSE == "issuer-cloudflare-dns01"
          assert cd.REQUEST_SCHEMA != "zog-protected-credential-delivery-request-v1"
          PY
