name: Selected protected graphical owner all SSM paths exact-head review
on:
  push:
    branches: [review/graphical-protected-all-ssm-paths-20261104]
  pull_request:
    paths:
      - src/zog/host_deploy/gateway/generic_pipeline.py
      - src/zog/host_deploy/gateway/image_build_execution.py
      - tests/test_graphical_selected_owner_all_ssm_paths.py
      - .github/workflows/graphical-selected-owner-all-ssm-paths.yml
permissions:
  contents: read
jobs:
  exact-head-source-review:
    runs-on: ubuntu-latest
    timeout-minutes: 16
    strategy:
      fail-fast: false
      matrix:
        python: ['3.12','3.13']
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/checkout@v4
        with:
          repository: zog144/root-control
          ref: ad5985ee602f24cbb5d45ef259c31d6c5a13e386
          path: companion-root-control
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - name: Prove exact selected root-control interface
        run: |
          test "$(git -C companion-root-control rev-parse HEAD)" = ad5985ee602f24cbb5d45ef259c31d6c5a13e386
          python - <<'PY'
          from pathlib import Path
          a=Path('src/zog/host_deploy/gateway/graphics_protected_owner_handoff.py').read_text()
          assert 'ad5985ee602f24cbb5d45ef259c31d6c5a13e386' in a
          root=Path('companion-root-control/src/zog/root_control/graphical_operation_owner_source.py').read_text()
          assert 'class SourceOnlyProtectedOwner' in root
          assert 'def revoke_signed(' in root
          PY
      - name: Install declared source-test dependencies
        run: python -m pip install 'pytest>=8,<10' 'cryptography>=44,<49' 'boto3>=1.34,<2'
      - name: Exact cross-owner source tests including prior gateway replay suite
        env:
          PYTHONPATH: ${{ github.workspace }}/src
        run: |
          python -m pytest -q -rs \
            tests/test_gateway_generic_pipeline.py \
            tests/test_gateway_graphical_original_ssm_intent.py \
            tests/test_gateway_graphical_replay_invariant.py \
            tests/test_gateway_graphical_submission_journal_review.py \
            tests/test_graphics_selected_owner_direct_route_denial.py \
            tests/test_graphical_selected_owner_all_ssm_paths.py
      - name: Disallow any production submission claim
        if: always()
        run: echo 'Source-only synthetic owner. No installed preflight owner, independent CAS, IAM/SSM path or real AWS execution. Native NO-GO.' >> "$GITHUB_STEP_SUMMARY"
