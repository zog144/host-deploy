name: Native compiler identity contract (isolated)
on:
  pull_request:
    branches: [unstable]
    paths:
      - 'src/zog/host_deploy/gateway/compiler_execution_identity.py'
      - 'src/zog/host_deploy/gateway/image_build_execution.py'
      - 'src/zog/host_deploy/gateway/image_build_dispatch.py'
      - 'tests/test_gateway_compiler_nonroot_native.py'
      - '.github/workflows/native-compiler-identity.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  uid-transition:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    permissions:
      contents: read
    steps:
      - name: Checkout source without persisted credentials
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5, Node 24
        with:
          persist-credentials: false
      - name: Python 3.12
        uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6, Node 24
        with:
          python-version: '3.12'
      - name: Install bounded public test dependencies
        run: |
          python -m pip install 'pytest>=8,<10' 'boto3>=1.34,<2'
      - name: Run genuine Linux kernel UID/GID and sealed identity test
        env:
          AWS_EC2_METADATA_DISABLED: 'true'
          AWS_DEFAULT_REGION: us-east-1
        run: |
          test "$(id -u)" != 0
          sudo env PYTHONPATH="$PWD/src" AWS_EC2_METADATA_DISABLED=true \
            "$(command -v python)" -m pytest -q tests/test_gateway_compiler_nonroot_native.py
