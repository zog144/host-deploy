name: Task C v3 root/deploy read-only history exact selection
on:
  push:
    branches: [regular/task-c-v3-checkpoint-consumer-20261107]
  pull_request:
    paths:
      - src/zog/host_deploy/gateway/graphics_owner_trust_service.py
      - src/zog/host_deploy/gateway/graphics_owner_trust_history.py
      - src/zog/host_deploy/gateway/graphics_owner_trust_install.py
      - deploy/graphical-trust-broker/zog-graphical-trust.service
      - tests/test_graphics_owner_trust_v3_install.py
      - src/zog/host_deploy/gateway/graphics_owner_trust_daemon.py
      - tests/test_graphics_owner_trust_v3_backend_observation.py
      - tests/test_graphics_owner_trust_v3_installation.py
      - tests/test_graphics_registry_backend_source.py
      - src/zog/host_deploy/gateway/graphics_registry_backend_source.py
      - .github/workflows/graphical-v3-checkpoint-consumer.yml
permissions:
  contents: read
jobs:
  v3-owner-broker:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        python: ['3.12','3.13']
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/checkout@v4
        with:
          repository: zog144/root-control
          ref: 3d2147407478ad46e82388ee86f36e61daec92c9
          path: companions/root-control
          persist-credentials: false
      - uses: actions/checkout@v4
        with:
          repository: zog144/host-install
          ref: 24376bd784b7efcc1e393188f792c41685e75f79
          path: companions/host-install
          persist-credentials: false
      - uses: actions/checkout@v4
        with:
          repository: zog144/host-install
          ref: 24376bd784b7efcc1e393188f792c41685e75f79
          path: companions/host-install
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - run: python -m pip install 'pytest>=8,<10' 'cryptography>=44,<49' 'boto3>=1.34,<2'
      - name: Exact source consumer/IPC/SSM denial
        env:
          PYTHONPATH: ${{ github.workspace }}/src:${{ github.workspace }}/tests:${{ github.workspace }}/companions/root-control/src:${{ github.workspace }}/companions/root-control/tests:${{ github.workspace }}/companions/host-install/src:${{ github.workspace }}/companions/host-install/tests:${{ github.workspace }}/companions/host-install/src:${{ github.workspace }}/companions/host-install/tests
        run: |
          test "$(git -C companions/root-control rev-parse HEAD)" = 3d2147407478ad46e82388ee86f36e61daec92c9
          test "$(git -C companions/host-install rev-parse HEAD)" = 24376bd784b7efcc1e393188f792c41685e75f79
          test "$(git -C companions/host-install rev-parse HEAD)" = 24376bd784b7efcc1e393188f792c41685e75f79
          python -m pytest -q -rs \
            tests/test_graphics_owner_trust_v3_installation.py \
            tests/test_graphics_owner_trust_v3_backend_observation.py \
            companions/root-control/tests/test_graphical_task_c_backend_observation.py \
            companions/root-control/tests/test_graphical_task_c_v3_backend_send_fence.py \
            tests/test_graphics_owner_trust_v3_install.py \
            tests/test_graphics_owner_trust_daemon.py \
            tests/test_graphics_owner_trust_history.py \
            tests/test_graphics_owner_trust_install.py \
            companions/root-control/tests/test_graphical_task_c_v3_readonly.py \
            companions/root-control/tests/test_graphical_s3_installation_checkpoint.py
      - if: always()
        run: echo 'V3 source-only root/deploy compatibility. Native readonly principal, S3 history, IPC placement and SSM SEND are unaccepted.' >> "$GITHUB_STEP_SUMMARY"
