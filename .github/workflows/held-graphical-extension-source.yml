name: Held graphical catalogue future extension source review
on:
  push:
    branches: [regular/held-graphics-next-catalogue-20261103]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  held-proposal-no-authority:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout host-deploy source proposal
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09
        with:
          persist-credentials: false
      - name: Checkout immutable image-build Workspace source candidate
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09
        with:
          repository: zog144/image-build
          ref: a1ad8fd41186d70cc2f7d8f4ebe7b0ae54e4f023
          path: dependencies/image-build-pr9
          persist-credentials: false
      - name: Checkout immutable Mesa and llvmpipe source candidate
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09
        with:
          repository: zog144/image-build
          ref: 9cbd652226b863a7b4bb2d6d9539722e1a262508
          path: dependencies/image-build-pr8
          persist-credentials: false
      - name: Setup Python 3.12
        uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1
        with:
          python-version: '3.12'
      - name: Install offline source-test dependencies
        run: |
          python -m pip install 'pytest>=8,<10' 'boto3>=1.34,<2' 'dbus-next==0.2.3' 'cryptography>=44,<49'
      - name: Prove proposal remains held and active gateway source unchanged
        env:
          AWS_EC2_METADATA_DISABLED: 'true'
          AWS_DEFAULT_REGION: us-east-1
          ZOG_HELD_PR9_SOURCE: dependencies/image-build-pr9
          ZOG_HELD_MESA_SOURCE: dependencies/image-build-pr8
        run: |
          python -m compileall -q tools/verify_held_graphical_extension.py tools/verify_held_graphical_source_dag.py tests/test_held_graphical_extension.py tests/test_held_graphical_source_dag_review.py
          PYTHONPATH=src python tools/verify_held_graphical_extension.py \
            --pr9-checkout dependencies/image-build-pr9 \
            --mesa-checkout dependencies/image-build-pr8
          PYTHONPATH=src:tests python -m pytest -q \
            tests/test_held_graphical_extension.py \
            tests/test_held_graphical_source_dag_review.py \
            tests/test_gateway_graphical_replay_invariant.py \
            tests/test_gateway_graphical_original_ssm_intent.py \
            tests/test_gateway_graphics_generation_chain.py \
            tests/test_gateway_task_catalogue.py \
            tests/test_gateway_protocol.py
      - name: Report authority remains held
        if: always()
        run: |
          echo 'Source plan only. Zero new task names in production protocol or selected catalogue.' >> "$GITHUB_STEP_SUMMARY"
          echo 'No SSM, AWS, compiler, task admission, protected Host or STATE mutation.' >> "$GITHUB_STEP_SUMMARY"
          echo 'Native issuer/rights/generation acceptance and real monotonic owner remain NO-GO.' >> "$GITHUB_STEP_SUMMARY"
