name: Fixed Fonts protected root-control sender (source only)
on:
  push:
    branches: [regular/fonts-protected-owner-sender-20261119]
  pull_request:
    paths:
      - src/zog/host_deploy/gateway/fonts_owner_sender.py
      - src/zog/host_deploy/gateway/project_current_observation.py
      - src/zog/host_deploy/gateway/simple_forward.py
      - src/zog/host_deploy/gateway/simple_forward.py
      - src/zog/host_deploy/gateway/image_build_execution.py
      - tests/test_gateway_fonts_protected_sender.py
      - tests/test_gateway_fonts_owner_root.py
      - .github/workflows/fonts-protected-owner.yml
  workflow_dispatch:
permissions:
  contents: read
jobs:
  protected-owner:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python: ['3.12', '3.13']
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09
        with:
          persist-credentials: false
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09
        with:
          repository: zog144/root-control
          ref: d9dfd6c02a5a96750f1213bf663cdceab72f1efd
          path: companions/root-control
          persist-credentials: false
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1
        with:
          python-version: ${{ matrix.python }}
      - run: |
          python -m pip install 'pytest>=8,<10' 'boto3>=1.34,<2' 'setuptools>=80,<83' 'wheel>=0.45,<1'
          python -m pip install --no-build-isolation --no-deps -e .
      - name: Rootless authorized request and protected owner simulated send
        run: |
          PYTHONPATH=src:companions/root-control/src python -m pytest -q \
            tests/test_gateway_fonts_protected_sender.py
      - name: Actual root-control root-owned journal, fake SSM sender
        run: |
          sudo env PYTHONPATH="$PWD/src:$PWD/companions/root-control/src" \
            "$(command -v python)" -m pytest -q \
            tests/test_gateway_fonts_owner_root.py
      - if: always()
        run: |
          echo 'Source-only root-control owner and fake SSM; no AWS SendCommand and no Fonts build' >> "$GITHUB_STEP_SUMMARY"
