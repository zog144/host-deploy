name: Versioned inherited-controller deployment and nonroot child source contract
on:
  push:
    branches: [regular/first-fonts-inherited-effective-identity-20261113]
  pull_request:
    paths:
      - src/zog/host_deploy/fonts_versioned_runtime.py
      - src/zog/host_deploy/fonts_issuer_persistence.py
      - src/zog/host_deploy/fonts_unit_composition.py
      - src/zog/host_deploy/fonts_systemd_command_identity.py
      - tests/test_fonts_issuer_persistence.py
      - src/zog/host_deploy/fonts_lane_runtime.py
      - src/zog/host_deploy/effective_project_access.py
      - tests/test_fonts_identity_route.py
      - tests/test_effective_project_access.py
      - src/zog/host_deploy/compiler_legacy_rollback.py
      - src/zog/host_deploy/cli.py
      - tests/test_fonts_versioned_runtime.py
      - .github/workflows/fonts-versioned-runtime-admission.yml
  workflow_dispatch:
permissions:
  contents: read
jobs:
  source-only:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        python: ['3.12', '3.13']
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          persist-credentials: false
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          repository: zog144/root-control
          ref: 35fc1ea8969c97a00cdb4b3c18ecb47bf1f83bbb
          path: companions/root-control
          persist-credentials: false
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          repository: zog144/box-control
          ref: b5903779e72ea852a125a268dcd35189339dc4ae
          path: companions/box-control
          persist-credentials: false
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          repository: zog144/image-build
          ref: d42703b9e4f7aedce2b9959aab855485add2795a
          path: companions/image-build
          persist-credentials: false
      # Audit the actual SSM/Project-current -> producer -> box-control
      # source path, not the historical schema-3 identity selector path.
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          repository: zog144/host-deploy
          ref: 5d093474063b0b11609e8be4b4dc090e531ef760
          path: companions/host-deploy-project-current
          persist-credentials: false
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          repository: zog144/image-build
          ref: bce80b258e445191248d9998620884a79f029013
          path: companions/image-build-project-current
          persist-credentials: false
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: ${{ matrix.python }}
      - name: Measure exact selected source trees (no runtime activation)
        run: |
          PYTHONPATH=src python - <<'PY'
          from pathlib import Path
          from zog.host_deploy.fonts_versioned_runtime import source_tree_sha256, SELECTED_SOURCES
          import json
          revisions = {
              "root-control": "35fc1ea8969c97a00cdb4b3c18ecb47bf1f83bbb",
              "box-control": "b5903779e72ea852a125a268dcd35189339dc4ae",
              "image-build": "d42703b9e4f7aedce2b9959aab855485add2795a",
          }
          measured = {}
          for component, expected in sorted(revisions.items()):
              observed = source_tree_sha256(Path("companions") / component)
              if observed["revision"] != expected:
                  raise SystemExit("selected source revision differs: " + component)
              measured[component] = observed
              print("ZOG_PINNED_SOURCE " + component + " " + observed["revision"]
                    + " sha256:" + observed["source_tree_sha256"], flush=True)
          if measured != SELECTED_SOURCES:
              raise SystemExit("selected source tuple differs from reviewed pins")
          PY
      - name: Source-only regression and compile
        run: |
          python -m pip install 'pytest>=8,<10' 'boto3>=1.35,<2'
          python -m compileall -q src/zog/host_deploy/fonts_issuer_persistence.py src/zog/host_deploy/fonts_unit_composition.py src/zog/host_deploy/fonts_systemd_command_identity.py src/zog/host_deploy/fonts_versioned_runtime.py src/zog/host_deploy/compiler_legacy_rollback.py src/zog/host_deploy/cli.py tests/test_fonts_versioned_runtime.py
          PYTHONPATH=src python -m pytest -q tests/test_fonts_versioned_runtime.py tests/test_fonts_issuer_persistence.py tests/test_effective_project_access.py tests/test_fonts_identity_route.py
      - name: Root-owned checks on disposable local runner files only
        run: |
          sudo env PYTHONPATH="$PWD/src:$PWD/tests" "$(command -v python)" -m pytest -q tests/test_fonts_versioned_runtime.py tests/test_fonts_issuer_persistence.py
      - name: Native Host and service activation remain prohibited
        if: always()
        run: |
          echo 'SOURCE ONLY: no root-control service selection, Fonts lane activation, SSM or compiler execution' >> "$GITHUB_STEP_SUMMARY"
