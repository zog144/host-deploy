name: Public source-only CI
on:
  push:
    branches: [unstable, main]
  pull_request:
    branches: [unstable, main]
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: public-source-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true
jobs:
  source-tests:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
    steps:
      - name: Checkout source without persisted credentials
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5, Node 24
        with:
          persist-credentials: false
      - name: Python 3.12
        uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6, Node 24
        with:
          python-version: '3.12'
      - name: Install bounded public dependencies
        run: |
          python -m pip install 'setuptools>=80,<83' 'wheel>=0.45,<1' 'pytest>=8,<10' 'boto3>=1.34,<2'
          python -m pip install --no-build-isolation --no-deps -e .
          python -m pip check
      - name: Compile all shipped Python sources and tests
        run: python -m compileall -q src tests scripts
      - name: Verify gateway authorization and run offline unit contracts
        env:
          AWS_EC2_METADATA_DISABLED: 'true'
          AWS_DEFAULT_REGION: us-east-1
        run: |
          python -m pytest -q tests/test_gateway_workflow_permissions.py tests/test_gateway_configuration.py tests/test_gateway_protocol.py tests/test_gateway_task_catalogue.py tests/test_gateway_dispatch.py tests/test_gateway_generic_pipeline.py tests/test_gateway_generic_consumer.py tests/test_gateway_generic_reporting.py tests/test_gateway_reviewed_supervisor.py tests/test_gateway_github.py tests/test_certificate_renewal.py tests/test_certificate_issuer_lifecycle.py tests/test_certificate_selected_inspection.py tests/test_certificate_authenticated_inspection.py tests/test_certificate_hostname_authority.py tests/test_certificate_issuer_observer.py tests/test_certificate_root_observation_binding.py tests/test_certificate_renewal_publication.py tests/test_certificate_delivery.py tests/test_public_companion_review.py tests/test_beacon_payload.py tests/test_beacon_activation.py tests/test_station.py tests/test_public_packaging_metadata.py tests/test_public_publisher_selection.py
      - name: Verify source package builds without private repositories
        run: |
          python -m pip wheel --no-build-isolation --no-deps --wheel-dir dist .
          python - <<'PY'
          from pathlib import Path
          import zipfile
          wheels = list(Path('dist').glob('host_deploy-*.whl'))
          assert len(wheels) == 1, wheels
          with zipfile.ZipFile(wheels[0]) as archive:
              names = archive.namelist()
              assert any(s.endswith('.dist-info/METADATA') for s in names)
              assert not any('/.aws/' in s or 'version-share-handoff.json' in s for s in names)
          PY
