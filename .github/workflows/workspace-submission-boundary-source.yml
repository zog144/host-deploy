name: Workspace source to protected graphical dispatch boundary
on:
  push:
    branches: [regular/graphical-submission-boundary-audit-20261103]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  synthetic-denials:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
    steps:
      - name: Checkout host-deploy exact candidate
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09
        with:
          persist-credentials: false
      - name: Checkout image-build PR9 exact reviewed source
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09
        with:
          repository: zog144/image-build
          ref: 6b64a7e1b6f9842554bd3b9eee5599e24ca2402c
          path: dependencies/image-build-pr9
          persist-credentials: false
      - name: Setup Python
        uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1
        with:
          python-version: '3.12'
      - name: Install bounded public source-test dependencies
        run: |
          python -m pip install 'pytest>=8,<10' 'boto3>=1.34,<2' 'dbus-next==0.2.3' 'cryptography>=44,<49'
      - name: Source handoff and actual host-deploy submission boundary regressions
        env:
          AWS_EC2_METADATA_DISABLED: 'true'
          AWS_DEFAULT_REGION: us-east-1
          ZOG_WORKSPACE_HANDOFF_SOURCE: dependencies/image-build-pr9
        run: |
          python -m compileall -q src tests/test_gateway_workspace_submission_boundary.py
          PYTHONPATH=src:tests python -m pytest -q \
            tests/test_gateway_workspace_submission_boundary.py \
            tests/test_gateway_graphics_generation_chain.py \
            tests/test_gateway_graphics_generation_attester.py \
            tests/test_gateway_graphics_chain_gateway.py \
            tests/test_gateway_graphics_chain_export.py \
            tests/test_gateway_task_catalogue.py \
            tests/test_gateway_generic_pipeline.py
      - name: Source-only denial, not native admission
        if: always()
        run: |
          echo 'No authorized compiler submission; no AWS credentials, queue calls, SSM commands, protected Host or STATE mutation.' >> "$GITHUB_STEP_SUMMARY"
