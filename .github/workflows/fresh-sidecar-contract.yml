name: Fresh restricted controller source contract
on:
  pull_request:
    branches: [unstable, main]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  fixed-build-only-role:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - name: Checkout host-deploy candidate
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5 Node24
        with:
          persist-credentials: false
      - name: Checkout exact new root-control executable
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5 Node24
        with:
          repository: zog144/root-control
          ref: 19d423cdf16531474de5680117867e12b5bb0620
          path: pinned-root-control
          persist-credentials: false
      - name: Compare source role, host-owned startup environment and frozen consumer pin
        run: |
          python - <<'PY'
          import ast
          from pathlib import Path
          import subprocess
          root = Path("pinned-root-control")
          head = subprocess.check_output(
              ["git", "-C", str(root), "rev-parse", "HEAD"], text=True).strip()
          assert head == "19d423cdf16531474de5680117867e12b5bb0620"
          source = (root / "src/zog/root_control/daemon.py").read_text()
          tree = ast.parse(source)
          symbols = {n.name for n in ast.walk(tree) if isinstance(n, (ast.FunctionDef, ast.ClassDef))}
          assert {"RootControlDaemon", "_authorize_role_request",
                  "_validate_role_startup", "_authorize_peer",
                  "_authorize_build_project"}.issubset(symbols)
          for literal in (
              "build-only-project-v1", "ROOT_CONTROL_ROLE",
              "ROOT_CONTROL_AUTHORIZED_PROJECT",
              "ROOT_CONTROL_CONTROLLER_UID", "ROOT_CONTROL_SOCKET_GID",
              "SO_PEERCRED", "systemd_version", "build_register",
          ):
              assert literal in source, literal
          from sys import path
          path.insert(0, str(Path("src").resolve()))
          from zog.host_deploy.gateway.compiler_execution_identity import (
              FRESH_ROOT_CONTROL_REVISION,
          )
          assert FRESH_ROOT_CONTROL_REVISION == head
          print("Reviewed exact build-only startup role and host-deploy v3 source pin")
          PY
      - name: Python 3.12
        uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6 Node24
        with:
          python-version: '3.12'
      - name: Run source-only isolated controller and budget tests
        run: |
          python -m pip install 'pytest>=8,<10' 'boto3>=1.34,<2'
          PYTHONPATH=src python -m pytest -q tests/test_gateway_fresh_cross_bootstrap.py tests/test_gateway_fresh_sidecar_budget.py
