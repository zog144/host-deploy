name: Beacon candidate source pins
on:
  push:
    branches: [regular/beacon-custom-state-directory-20261116]
  pull_request:
    paths:
      - scripts/beacon_candidate_selection.py
      - src/zog/host_deploy/beacon_sources.json
      - tests/test_public_publisher_selection.py
      - tests/test_beacon_candidate_source.py
      - .github/workflows/beacon-candidate-pins.yml
  workflow_dispatch:
permissions:
  contents: read
jobs:
  candidate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          persist-credentials: false
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: '3.12'
      - name: Acquire exact public candidate commits
        run: |
          set -eu
          mkdir -p "$RUNNER_TEMP/beacon-candidate"
          for name in host-discover host-identify host-install; do
            git clone --no-checkout --filter=blob:none "https://github.com/zog144/$name.git" "$RUNNER_TEMP/beacon-candidate/$name"
          done
          git -C "$RUNNER_TEMP/beacon-candidate/host-discover" checkout --detach 10db0fbb2126cb868af7c5e2f79c2bab3c17ea0e
          git -C "$RUNNER_TEMP/beacon-candidate/host-identify" checkout --detach 4a176373ff4cb47a66a8ab1b5fd3d6ff01ff2a3b
          git -C "$RUNNER_TEMP/beacon-candidate/host-install" checkout --detach c8ff1722f9e0c6df755e637047a5be3baa90a82b
      - name: Install local source-test requirements
        run: |
          python -m pip install 'setuptools>=80,<83' 'wheel>=0.45,<1' 'pytest>=8,<10' 'boto3>=1.34,<2'
          python -m pip install --no-build-isolation --no-deps -e .
      - name: Verify independent candidate file inventory and installer source
        run: |
          set -eu
          python scripts/beacon_candidate_selection.py --source "$RUNNER_TEMP/beacon-candidate" --verify src/zog/host_deploy/beacon_sources.json
          HOST_DEPLOY_CANDIDATE_SOURCE_DIRECTORY="$RUNNER_TEMP/beacon-candidate" python -m pytest -q \
            tests/test_public_publisher_selection.py tests/test_beacon_candidate_source.py \
            tests/test_beacon_payload.py tests/test_beacon_activation.py
          # The released publisher/index must pass even without candidate trees.
          env -u HOST_DEPLOY_CANDIDATE_SOURCE_DIRECTORY python -m pytest -q tests/test_public_publisher_selection.py
