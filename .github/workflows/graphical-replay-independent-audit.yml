name: Graphical SSM send-once and authenticated recipe snapshot source regression
on:
  push:
    branches: [regular/graphical-operation-fence-snapshot-20261103]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  review:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout candidate PR15 review head
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09
        with:
          persist-credentials: false
      - name: Checkout immutable original image-build PR9 source under test
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09
        with:
          repository: zog144/image-build
          ref: 6b64a7e1b6f9842554bd3b9eee5599e24ca2402c
          path: dependencies/image-build-pr9-reviewed
          persist-credentials: false
      - name: Python 3.12
        uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1
        with:
          python-version: '3.12'
      - name: Install offline test requirements only
        run: python -m pip install 'pytest>=8,<10' 'boto3>=1.34,<2' 'dbus-next==0.2.3' 'cryptography>=44,<49'
      - name: Run PR15 regression suite and independent pending-security probes
        env:
          AWS_EC2_METADATA_DISABLED: 'true'
          AWS_DEFAULT_REGION: us-east-1
          ZOG_WORKSPACE_HANDOFF_SOURCE: dependencies/image-build-pr9-reviewed
        run: |
          python -m compileall -q src/zog/host_deploy/gateway tests/test_gateway_graphical_replay_invariant.py
          PYTHONPATH=src:tests python -m pytest -q -rx \
            tests/test_gateway_graphical_replay_invariant.py \
            tests/test_gateway_graphical_submission_journal_review.py \
            tests/test_gateway_workspace_submission_boundary.py \
            tests/test_gateway_generic_pipeline.py \
            tests/test_gateway_graphics_generation_chain.py \
            tests/test_gateway_graphics_generation_attester.py \
            tests/test_gateway_graphics_gateway_history.py \
            tests/test_gateway_graphics_chain_gateway.py \
            tests/test_gateway_graphics_chain_export.py \
            tests/test_gateway_graphics_stage_once.py \
            tests/test_gateway_task_catalogue.py \
            tests/test_gateway_dispatch.py \
            tests/test_gateway_consumer.py
      - name: Clearly report that XFAILs block security acceptance
        if: always()
        run: |
          echo 'PASS required for prior whole-journal replay and coherent snapshot-substitution regressions.' >> "$GITHUB_STEP_SUMMARY"
          echo 'Source CI is not native protected monotonic issuer/reboot security acceptance.' >> "$GITHUB_STEP_SUMMARY"
          echo 'No credentials, AWS/SSM operations, compiler submission, or protected Host mutation.' >> "$GITHUB_STEP_SUMMARY"
