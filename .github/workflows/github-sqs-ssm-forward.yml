name: GitHub SQS SSM finite forwarding source tests
on:
  push:
    branches: [regular/github-sqs-ssm-direct-forward-20261116]
  pull_request:
    paths:
      - src/zog/host_deploy/gateway/simple_forward.py
      - src/zog/host_deploy/gateway/protocol.py
      - src/zog/host_deploy/gateway/github_dispatch.py
      - src/zog/host_deploy/gateway/consumer.py
      - src/zog/host_deploy/gateway/ledger.py
      - src/zog/host_deploy/gateway/image_build_dispatch.py
      - src/zog/host_deploy/gateway/image_build_execution.py
      - tests/test_gateway_simple_forward.py
      - tests/test_gateway_fonts_protected_sender.py
      - src/zog/host_deploy/gateway/fonts_owner_sender.py
      - .github/workflows/github-sqs-ssm-forward.yml
  workflow_dispatch:
permissions:
  contents: read
jobs:
  source:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python: ['3.12', '3.13']
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          persist-credentials: false
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: ${{ matrix.python }}
      - name: Install public source dependencies
        run: |
          python -m pip install 'setuptools>=80,<83' 'wheel>=0.45,<1' 'pytest>=8,<10' 'boto3>=1.34,<2'
          python -m pip install --no-build-isolation --no-deps -e .
          python -m compileall -q src/zog/host_deploy/gateway tests/test_gateway_simple_forward.py
      - name: Original authorized issue and finite SSM send/recover contract
        run: |
          python -m pytest -q tests/test_gateway_fonts_protected_sender.py \
            tests/test_gateway_simple_forward.py \
            tests/test_gateway_first_fonts_issue_event.py \
            tests/test_gateway_protocol.py \
            tests/test_gateway_consumer.py \
            tests/test_gateway_trusted_host_ssm.py
      - name: Native run remains outside CI
        if: always()
        run: |
          echo 'SOURCE ONLY: no live GitHub issue, SQS, SSM or Fonts compilation submitted' >> "$GITHUB_STEP_SUMMARY"
