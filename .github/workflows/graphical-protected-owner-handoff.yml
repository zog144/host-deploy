name: Exact graphical gateway to protected send owner source contract
on:
  push:
    branches: [review/graphical-independent-send-owner-consumer-20261103]
permissions:
  contents: read
jobs:
  synthetic-cross-owner:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    strategy:
      fail-fast: false
      matrix:
        python: ['3.12','3.13']
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/checkout@v4
        with:
          repository: zog144/root-control
          ref: 66c5e2b1ec43a6d785bb140964af3cdcf927998a
          path: companion-root-control
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - name: Verify exact source selected owner
        run: test "$(git -C companion-root-control rev-parse HEAD)" = 66c5e2b1ec43a6d785bb140964af3cdcf927998a
      - run: python -m pip install 'pytest>=8,<10' 'cryptography>=43,<47'
      - name: Test exact original operation source and independent owner
        env:
          PYTHONPATH: ${{ github.workspace }}/src
        run: python -m pytest -q -rs tests/test_graphics_protected_owner_handoff.py
      - run: echo 'No protected owner installed or wired to SendCommand. No SSM, AWS, production pin or STATE.' >> "$GITHUB_STEP_SUMMARY"
