name: Selected graphical owner native-only gateway source denial
on:
  push:
    branches: [review/graphical-independent-send-owner-consumer-20261103]
permissions:
  contents: read
jobs:
  synthetic-cross-owner:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    strategy:
      fail-fast: false
      matrix:
        python: ['3.12','3.13']
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/checkout@v4
        with:
          repository: zog144/root-control
          ref: 2078f0f76c23fed44da0d4f073693786e32a1cc2
          path: companion-root-control
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - name: Verify exact source selected owner
        run: test "$(git -C companion-root-control rev-parse HEAD)" = 2078f0f76c23fed44da0d4f073693786e32a1cc2
      - run: python -m pip install 'pytest>=8,<10' 'cryptography>=43,<47'
      - name: Test exact original operation source and independent owner
        env:
          PYTHONPATH: ${{ github.workspace }}/src
        run: python -m pytest -q -rs tests/test_graphics_selected_owner_direct_route_denial.py
      - run: echo 'No protected owner installed or wired to SendCommand. No SSM, AWS, production pin or STATE.' >> "$GITHUB_STEP_SUMMARY"
