name: Selected Project and controller lanes (source only)
on:
  push:
    branches: [regular/project-controller-only-lanes-20261117]
  pull_request:
    paths:
      - src/zog/host_deploy/image_build_lanes.py
      - src/zog/host_deploy/existing_project_runtime.py
      - src/zog/host_deploy/gateway/project_current.py
      - src/zog/host_deploy/gateway/project_current_observation.py
      - src/zog/host_deploy/gateway/simple_forward.py
      - src/zog/host_deploy/gateway/fonts_owner_sender.py
      - src/zog/host_deploy/gateway/image_build_dispatch.py
      - tests/test_gateway_project_current.py
      - tests/test_gateway_project_current_real_resume.py
      - tests/test_gateway_fonts_protected_sender.py
      - src/zog/host_deploy/gateway/fonts_owner_sender.py
      - tests/test_existing_project_lane.py
      - tests/test_image_build_lanes.py
  workflow_dispatch:
permissions:
  contents: read
jobs:
  source:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python: ['3.12', '3.13']
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09
        with:
          persist-credentials: false
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09
        with:
          repository: zog144/image-build
          ref: bce80b258e445191248d9998620884a79f029013
          path: companions/image-build
          persist-credentials: false
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1
        with:
          python-version: ${{ matrix.python }}
      - run: |
          python -m pip install 'setuptools>=80,<83' 'wheel>=0.45,<1' 'pytest>=8,<10' 'boto3>=1.34,<2'
          python -m pip install --no-build-isolation --no-deps -e .
      - run: |
          python -m compileall -q src/zog/host_deploy tests/test_gateway_project_current.py
          python -m pytest -q tests/test_gateway_fonts_protected_sender.py \
            tests/test_gateway_project_current.py \
            tests/test_gateway_project_current_real_resume.py \
            tests/test_existing_project_lane.py tests/test_image_build_lanes.py \
            tests/test_gateway_simple_forward.py tests/test_gateway_first_fonts_issue_event.py \
            tests/test_gateway_issue_fifo_first_fonts.py
      - if: always()
        run: |
          echo 'Source-only fake producer: no real Fonts compilation or gateway activation' >> "$GITHUB_STEP_SUMMARY"
