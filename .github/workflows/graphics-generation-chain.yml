name: Bounded graphical generation chaining - source only
on:
  push:
    branches: [regular/graphical-generation-chain-20261031]
  pull_request:
    branches: [regular/first-graphics-catalogue-20261031, regular/toolchain-gateway-20261019]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  fixed-predecessor-contract:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - name: Checkout host-deploy candidate
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09
        with:
          persist-credentials: false
      - name: Checkout frozen producer
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09
        with:
          repository: zog144/image-build
          ref: b0f53dbdec0e88b9b37feb5317398db3d20507dd
          path: dependencies/image-build
          persist-credentials: false
      - name: Setup Python
        uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1
        with:
          python-version: "3.12"
      - name: Check exact image-build and original October pin
        run: |
          python - <<'PY'
          from pathlib import Path
          import hashlib, subprocess
          root = Path("dependencies/image-build")
          assert subprocess.check_output(
            ["git", "-C", str(root), "rev-parse", "HEAD"], text=True
          ).strip() == "b0f53dbdec0e88b9b37feb5317398db3d20507dd"
          pin = root / "project/pins/2026-10-01/commit-pin.py"
          assert hashlib.sha256(pin.read_bytes()).hexdigest() == (
            "d3104eeddbbbe63fe3279c58ce9807f3b5250632ecdca4826abc028bcf923b36"
          )
          PY
      - name: Install isolated source test dependencies
        run: python -m pip install 'pytest>=8,<10' 'boto3>=1.34,<2' 'dbus-next==0.2.3'
      - name: Finite chained proofs, tamper refusal, source regression
        env:
          AWS_EC2_METADATA_DISABLED: "true"
        run: |
          python -m compileall -q src/zog/host_deploy/gateway/graphics_generation_chain.py
          PYTHONPATH=src python -m pytest -q tests/test_gateway_graphics_generation_chain.py tests/test_gateway_task_catalogue.py tests/test_gateway_first_graphics_catalogue.py
