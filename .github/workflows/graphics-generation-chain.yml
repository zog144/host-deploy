name: Bounded graphical generation chaining - source only
on:
  push:
    branches: [regular/graphical-generation-chain-20261031, regular/graphical-attester-authority-hardening-20261101]
  pull_request:
    branches: [regular/first-graphics-catalogue-20261031, regular/toolchain-gateway-20261019]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  fixed-predecessor-contract:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - name: Checkout host-deploy candidate
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09
        with:
          persist-credentials: false
      - name: Checkout frozen producer
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09
        with:
          repository: zog144/image-build
          ref: 1f07e83dbd80dacb9bed0d6494c697375f0e26cd
          path: dependencies/image-build
          persist-credentials: false
      - name: Setup Python
        uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1
        with:
          python-version: "3.12"
      - name: Check exact image-build and original October pin
        run: |
          python - <<'PY'
          from pathlib import Path
          import hashlib, subprocess
          root = Path("dependencies/image-build")
          assert subprocess.check_output(
            ["git", "-C", str(root), "rev-parse", "HEAD"], text=True
          ).strip() == "1f07e83dbd80dacb9bed0d6494c697375f0e26cd"
          pin = root / "project/pins/2026-10-01/commit-pin.py"
          assert hashlib.sha256(pin.read_bytes()).hexdigest() == (
            "d3104eeddbbbe63fe3279c58ce9807f3b5250632ecdca4826abc028bcf923b36"
          )
          PY
      - name: Install isolated source test dependencies
        run: python -m pip install 'pytest>=8,<10' 'boto3>=1.34,<2' 'dbus-next==0.2.3' 'cryptography>=44,<49'
      - name: Finite chained proofs, tamper refusal, source regression
        env:
          AWS_EC2_METADATA_DISABLED: "true"
        run: |
          python -m compileall -q src/zog/host_deploy/gateway/graphics_generation_chain.py src/zog/host_deploy/gateway/graphics_generation_attester.py src/zog/host_deploy/gateway/graphics_attester_import.py src/zog/host_deploy/gateway/graphics_gateway_history.py src/zog/host_deploy/gateway/graphics_chain_export.py src/zog/host_deploy/gateway/graphics_stage_once.py
          PYTHONPATH=src python -m pytest -q tests/test_gateway_graphics_generation_chain.py tests/test_gateway_graphics_generation_attester.py tests/test_gateway_graphics_gateway_history.py tests/test_gateway_graphics_chain_gateway.py tests/test_gateway_graphics_chain_export.py tests/test_gateway_graphics_stage_once.py tests/test_gateway_task_catalogue.py tests/test_gateway_first_graphics_catalogue.py
      - name: Root-owned one-shot step files in ephemeral CI only
        env:
          AWS_EC2_METADATA_DISABLED: "true"
        run: |
          sudo -E env PYTHONPATH="$PWD/src" "$(command -v python)" -m pytest -q tests/test_gateway_graphics_generation_chain_native.py tests/test_gateway_graphics_attester_import_native.py tests/test_gateway_graphics_owner_export_native.py -rs
      - name: Existing gateway request, dispatch and supervisor compatibility
        env:
          AWS_EC2_METADATA_DISABLED: "true"
          AWS_DEFAULT_REGION: us-east-1
        run: |
          PYTHONPATH=src python -m pytest -q tests/test_gateway_generic_consumer.py tests/test_gateway_generic_pipeline.py tests/test_gateway_dispatch.py tests/test_gateway_protocol.py tests/test_gateway_reviewed_supervisor.py tests/test_gateway_generic_reporting.py
