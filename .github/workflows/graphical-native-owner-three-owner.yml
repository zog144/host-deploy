name: Selected graphical native owner three-owner source integration
on:
  push:
    branches: [regular/graphical-native-owner-ipc-consumer-20261104]
  pull_request:
    paths:
      - src/zog/host_deploy/gateway/graphics_native_owner_client.py
      - src/zog/host_deploy/gateway/generic_pipeline.py
      - tests/test_graphics_native_owner_ipc.py
      - .github/workflows/graphical-native-owner-three-owner.yml
permissions:
  contents: read
jobs:
  independent-source:
    runs-on: ubuntu-latest
    timeout-minutes: 18
    strategy:
      fail-fast: false
      matrix:
        python: ['3.12','3.13']
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/checkout@v4
        with:
          repository: zog144/root-control
          ref: 6cf1e3064f77a6aefe17bf75f50c4b8d83a15762
          path: companion-root-control
          persist-credentials: false
      - uses: actions/checkout@v4
        with:
          repository: zog144/host-install
          ref: 7045e674dfae931624b2332941e19045eaf1369c
          path: companion-host-install
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - name: Immutable companion revisions and no production source substitution
        run: |
          test "$(git -C companion-root-control rev-parse HEAD)" = 6cf1e3064f77a6aefe17bf75f50c4b8d83a15762
          test "$(git -C companion-host-install rev-parse HEAD)" = 7045e674dfae931624b2332941e19045eaf1369c
          python - <<'PY'
          from pathlib import Path
          r=Path('src/zog/host_deploy/gateway/graphics_native_owner_client.py').read_text()
          i=Path('companion-host-install/src/zog/host_install/graphical_native_owner_install.py').read_text()
          assert '6cf1e3064f77a6aefe17bf75f50c4b8d83a15762' in r
          assert '6cf1e3064f77a6aefe17bf75f50c4b8d83a15762' in i
          PY
      - run: python -m pip install 'pytest>=8,<10' 'cryptography>=44,<49' 'boto3>=1.34,<2'
      - name: Full source synthetic three-owner IPC, claim, IAM and preflight denial
        env:
          PYTHONPATH: ${{ github.workspace }}/src:${{ github.workspace }}/companion-root-control/src:${{ github.workspace }}/companion-host-install/src
        run: |
          python -m pytest -q \
            tests/test_graphics_native_owner_ipc.py \
            tests/test_graphics_selected_owner_direct_route_denial.py \
            tests/test_graphical_selected_owner_all_ssm_paths.py \
            tests/test_gateway_generic_pipeline.py \
            companion-root-control/tests/test_graphical_native_owner.py \
            companion-host-install/tests/test_graphical_native_owner_install.py
      - if: always()
        run: echo 'Synthetic-only. No real root-installation, independent antirollback source, AWS IAM or SSM, native preflight or reboot admission.' >> "$GITHUB_STEP_SUMMARY"
